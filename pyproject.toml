[project]
name = "cmd-tray"
version = "1.0.0"
description = "Run a command in a new console and minimize it to the Windows system tray."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
dependencies = [
    "wxPython>=4.2.4",
    "PyYAML>=6.0",
    "pywin32>=308; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/TunMax/cmd_tray"
Repository = "https://github.com/TunMax/cmd_tray"

[tool.uv]
# 这是单文件应用，不需要将项目本身安装进虚拟环境
package = false
